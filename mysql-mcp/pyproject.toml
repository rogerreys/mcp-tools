[project]
name = "mysql-mcp-server"
version = "0.1.0"
description = "MCP server (read-only) for exploring a MySQL database's schema and data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2.1,<3",
  "mysql-connector-python>=9.0",
  "pydantic>=2.7",
  "sqlparse>=0.5",
]

[project.scripts]
mysql-mcp-server = "mysql_mcp_server.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mysql_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a real MySQL instance (see mysql/docker-compose.yml)",
]
